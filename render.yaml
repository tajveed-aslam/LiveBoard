# Render Blueprint for the API. Secrets marked sync: false are entered in the Render dashboard.
services:
  - type: web
    name: liveboard-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    # Same region as the Neon database (AWS eu-central-1) so API ↔ DB calls stay fast.
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: ConnectionStrings__Default
        sync: false # postgres://... URL from Neon (or Render Postgres)
      - key: Jwt__Key
        generateValue: true
      - key: Gemini__ApiKey
        sync: false
      - key: Cors__Origins__0
        sync: false # e.g. https://liveboard.vercel.app
